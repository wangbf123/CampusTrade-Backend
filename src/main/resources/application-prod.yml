server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.campustrade: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

app:
  demo:
    seed-data: false
  auth:
    token-ttl-minutes: ${APP_AUTH_TOKEN_TTL_MINUTES:720}
  cache:
    item-detail-ttl-seconds: ${APP_CACHE_ITEM_DETAIL_TTL_SECONDS:1800}
    null-item-ttl-seconds: ${APP_CACHE_NULL_ITEM_TTL_SECONDS:120}
    random-jitter-seconds: ${APP_CACHE_RANDOM_JITTER_SECONDS:300}
  order-timeout:
    hours: ${APP_ORDER_TIMEOUT_HOURS:24}
    scan-delay: ${APP_ORDER_TIMEOUT_SCAN_DELAY_MS:60000}
    batch-size: ${APP_ORDER_TIMEOUT_BATCH_SIZE:50}
  outbox:
    publish-delay: ${APP_OUTBOX_PUBLISH_DELAY_MS:3000}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:20}
    max-retry: ${APP_OUTBOX_MAX_RETRY:5}
  observability:
    request-id-header: ${APP_OBSERVABILITY_REQUEST_ID_HEADER:X-Request-Id}
    slow-request-enabled: ${APP_OBSERVABILITY_SLOW_REQUEST_ENABLED:true}
    slow-request-threshold-ms: ${APP_OBSERVABILITY_SLOW_REQUEST_THRESHOLD_MS:1000}
  production-readiness:
    enabled: ${APP_PRODUCTION_READINESS_ENABLED:true}
